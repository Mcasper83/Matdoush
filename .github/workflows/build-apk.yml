name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;35.0.0"

          mkdir -p "$ANDROID_HOME/tools/bin"
          ln -sf "$(command -v sdkmanager)" "$ANDROID_HOME/tools/bin/sdkmanager"

          echo "=== SDK CHECK ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "SDKMANAGER=$(command -v sdkmanager)"

          ls -la "$ANDROID_HOME/build-tools"

          test -x "$ANDROID_HOME/build-tools/35.0.0/aidl"
          test -x "$ANDROID_HOME/tools/bin/sdkmanager"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.6.0
          pip install cython==0.29.37

      - name: Configure Android environment
        run: |
          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROIDAPI=33" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=24" >> "$GITHUB_ENV"

      - name: Clean Buildozer Android cache
        run: |
          rm -rf "$HOME/.buildozer/android/platform/android-sdk"
          rm -rf "$HOME/.buildozer/android/platform/build-tools"
          rm -rf "$HOME/.buildozer/android/platform/python-for-android"

      - name: Pin python-for-android
        run: |
          P4A_DIR="$HOME/.buildozer/android/platform/python-for-android"

          git clone --depth 1 --branch v2026.05.09 https://github.com/kivy/python-for-android.git "$P4A_DIR"

          echo "=== P4A VERSION ==="
          git -C "$P4A_DIR" describe --tags --always

      - name: Build APK
        run: |
          buildozer android debug

      - name: Verify APK
        run: |
          echo "=== APK OUTPUT ==="
          ls -lah bin/
          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Matdoush-APK
          path: bin/*.apk
