name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;35.0.0"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.37

      - name: Configure Buildozer Android SDK
        run: |
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk"
          ln -sfn "$ANDROID_HOME/platform-tools" "$HOME/.buildozer/android/platform/android-sdk/platform-tools"
          ln -sfn "$ANDROID_HOME/platforms" "$HOME/.buildozer/android/platform/android-sdk/platforms"
          ln -sfn "$ANDROID_HOME/build-tools" "$HOME/.buildozer/android/platform/android-sdk/build-tools"
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk/tools/bin"
          ln -sfn "$(which sdkmanager)" "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Matdoush-APK
          path: bin/*.apk
